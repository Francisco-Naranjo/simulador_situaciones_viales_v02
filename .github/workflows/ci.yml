name: CI · Via Segura (Caso 08)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-rag:
    name: Pytest & Evaluacion RAG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas Pytest
        run: python -m pytest tests/ -v

      - name: Ejecutar evaluacion RAG (referencia e independiente)
        run: python eval/run_eval.py

  frontend-build:
    name: Compilacion Frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y compilar frontend
        run: |
          npm ci
          npm run build
